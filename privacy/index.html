<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved — Valsiva Privacy Policy</title>

<!--
  This URL is the one Plaid holds on file, so it has to keep resolving even
  after the dashboard entry is updated — old links in old records outlive the
  records themselves.

  GitHub Pages serves static files and cannot issue a 301, so this is done
  three ways over: the canonical tells search engines which copy is real, the
  meta refresh moves a browser with no JavaScript, and the script moves one
  with JavaScript a beat sooner. The visible link is the fourth: whatever
  fails, a person still gets there by reading the page.

  replace() rather than assign() so the back button returns to wherever the
  visitor came from instead of bouncing them forward again.
-->
<link rel="canonical" href="https://valsiva.com/privacy/">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=https://valsiva.com/privacy/">
<script>location.replace('https://valsiva.com/privacy/');</script>

<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #111313; color: #F7F9F7; text-align: center; padding: 24px;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  p { color: #AEB4B0; margin: 0 0 20px; }
  a { color: #36D99A; }
</style>
</head>
<body>
  <main>
    <h1>The privacy policy has moved</h1>
    <p>It now lives on Valsiva’s own site.</p>
    <p><a href="https://valsiva.com/privacy/">valsiva.com/privacy/</a></p>
  </main>
</body>
</html>
